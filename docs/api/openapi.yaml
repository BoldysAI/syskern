openapi: 3.0.3
info:
  title: Syskern Pricing API
  version: 0.1.0
  description: Backend API for the Syskern pricing platform (MVP1).
paths:
  /api/attribute-values/:
    get:
      operationId: attribute_values_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - attribute-values
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductAttributeValueList'
          description: ''
    post:
      operationId: attribute_values_create
      tags:
      - attribute-values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributeValue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductAttributeValue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductAttributeValue'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeValue'
          description: ''
  /api/attribute-values/{id}/:
    get:
      operationId: attribute_values_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product attribute value.
        required: true
      tags:
      - attribute-values
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeValue'
          description: ''
    put:
      operationId: attribute_values_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product attribute value.
        required: true
      tags:
      - attribute-values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAttributeValue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductAttributeValue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductAttributeValue'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeValue'
          description: ''
    patch:
      operationId: attribute_values_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product attribute value.
        required: true
      tags:
      - attribute-values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductAttributeValue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductAttributeValue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductAttributeValue'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeValue'
          description: ''
    delete:
      operationId: attribute_values_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this product attribute value.
        required: true
      tags:
      - attribute-values
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/attributes/:
    get:
      operationId: attributes_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - commercial
          - logistic
          - marketing
          - structural
          - technical
        description: |-
          * `structural` - Structural
          * `technical` - Technical
          * `marketing` - Marketing
          * `commercial` - Commercial
          * `logistic` - Logistic
      - in: query
        name: data_type
        schema:
          type: string
          enum:
          - boolean
          - date
          - multiselect
          - number
          - select
          - text
        description: |-
          * `text` - Text
          * `number` - Number
          * `boolean` - Boolean
          * `date` - Date
          * `select` - Single choice
          * `multiselect` - Multiple choice
      - in: query
        name: is_filterable
        schema:
          type: boolean
      - in: query
        name: is_required
        schema:
          type: boolean
      - in: query
        name: is_searchable
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - attributes
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttributeRegistryList'
          description: ''
    post:
      operationId: attributes_create
      tags:
      - attributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeRegistry'
          description: ''
  /api/attributes/{id}/:
    get:
      operationId: attributes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attribute registry.
        required: true
      tags:
      - attributes
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeRegistry'
          description: ''
    put:
      operationId: attributes_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attribute registry.
        required: true
      tags:
      - attributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeRegistry'
          description: ''
    patch:
      operationId: attributes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attribute registry.
        required: true
      tags:
      - attributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttributeRegistry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttributeRegistry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttributeRegistry'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeRegistry'
          description: ''
    delete:
      operationId: attributes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attribute registry.
        required: true
      tags:
      - attributes
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/attributes/reorder/:
    post:
      operationId: attributes_reorder_create
      description: 'Body: `{"ids": [uuid, uuid, ...]}` — display_order set by position.'
      tags:
      - attributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeRegistry'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeRegistry'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/session:
    get:
      operationId: auth_session_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/brands:
    get:
      operationId: brands_retrieve
      tags:
      - brands
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/clients/:
    get:
      operationId: clients_list
      parameters:
      - in: query
        name: address_country
        schema:
          type: string
      - in: query
        name: is_prospect
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: preferred_currency
        schema:
          type: string
          enum:
          - EUR
          - RMB
          - USD
        description: |-
          * `EUR` - Euro
          * `USD` - US Dollar
          * `RMB` - Renminbi
      - in: query
        name: preferred_language
        schema:
          type: string
          enum:
          - en
          - es
          - fr
        description: |-
          * `fr` - Français
          * `en` - English
          * `es` - Español
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: segment
        schema:
          type: string
      tags:
      - clients
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: clients_create
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/clients/{id}/:
    get:
      operationId: clients_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    put:
      operationId: clients_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    patch:
      operationId: clients_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClient'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    delete:
      operationId: clients_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this client.
        required: true
      tags:
      - clients
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/dashboard/summary:
    get:
      operationId: dashboard_summary_retrieve
      description: Aggregated home dashboard metrics (read-only).
      tags:
      - dashboard
      responses:
        '200':
          description: No response body
  /api/document-library/:
    get:
      operationId: document_library_list
      description: Document library. Metadata via PATCH; file fields are upload-only.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: language
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - document-library
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentLibraryList'
          description: ''
    post:
      operationId: document_library_create
      description: Document library. Metadata via PATCH; file fields are upload-only.
      tags:
      - document-library
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentLibrary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentLibrary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentLibrary'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLibrary'
          description: ''
  /api/document-library/{id}/:
    get:
      operationId: document_library_retrieve
      description: Document library. Metadata via PATCH; file fields are upload-only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document library.
        required: true
      tags:
      - document-library
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLibrary'
          description: ''
    patch:
      operationId: document_library_partial_update
      description: Document library. Metadata via PATCH; file fields are upload-only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document library.
        required: true
      tags:
      - document-library
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentLibrary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumentLibrary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumentLibrary'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLibrary'
          description: ''
    delete:
      operationId: document_library_destroy
      description: Document library. Metadata via PATCH; file fields are upload-only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document library.
        required: true
      tags:
      - document-library
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/document-library/{id}/download/:
    get:
      operationId: document_library_download_retrieve
      description: |-
        Stream the stored file (local). Prod: return a Supabase signed URL.

        ``?inline=1`` serves the file inline (for PDF / image preview) instead
        of forcing a download.

        ``@xframe_options_sameorigin`` overrides the site-wide
        ``X-Frame-Options: DENY`` for this response only, so the same-origin
        PDF/image preview can render inside an ``<iframe>`` (otherwise prod
        blocks the embed with ``ERR_BLOCKED_BY_RESPONSE``).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document library.
        required: true
      tags:
      - document-library
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLibrary'
          description: ''
  /api/document-library/{id}/versions/:
    get:
      operationId: document_library_versions_retrieve
      description: Version chain of this document — same (product, language, file_name).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document library.
        required: true
      tags:
      - document-library
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLibrary'
          description: ''
  /api/document-library/upload/:
    post:
      operationId: document_library_upload_create
      description: Validate + store a file, with auto-versioning by (product, language,
        name).
      tags:
      - document-library
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentLibrary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentLibrary'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLibrary'
          description: ''
  /api/factory-codes:
    get:
      operationId: factory_codes_retrieve
      tags:
      - factory-codes
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/hierarchy/distinct:
    get:
      operationId: hierarchy_distinct_retrieve
      description: GET /api/hierarchy/distinct?level=universe[&universe=Tube&family=...]
      tags:
      - hierarchy
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/incoterms:
    get:
      operationId: incoterms_retrieve
      description: |-
        Read-only listing of supported incoterms (CDC §12.2).

        Reads the seeded `incoterms` reference table (CDC §3.3).
      tags:
      - incoterms
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/market-parameters/:
    get:
      operationId: market_parameters_list
      parameters:
      - in: query
        name: copper_market
        schema:
          type: string
          enum:
          - LME
          - SHE
        description: |-
          * `LME` - London Metal Exchange
          * `SHE` - Shanghai Futures Exchange
      - in: query
        name: fx_from_currency
        schema:
          type: string
          enum:
          - EUR
          - RMB
          - USD
        description: |-
          * `EUR` - Euro
          * `USD` - US Dollar
          * `RMB` - Renminbi
      - in: query
        name: fx_to_currency
        schema:
          type: string
          enum:
          - EUR
          - RMB
          - USD
        description: |-
          * `EUR` - Euro
          * `USD` - US Dollar
          * `RMB` - Renminbi
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: parameter_type
        schema:
          type: string
          enum:
          - copper_price
          - fx_rate
        description: |-
          * `copper_price` - Copper spot price
          * `fx_rate` - FX rate
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - market-parameters
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarketParameterList'
          description: ''
    post:
      operationId: market_parameters_create
      tags:
      - market-parameters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketParameter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarketParameter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarketParameter'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketParameter'
          description: ''
  /api/market-parameters/{id}/:
    get:
      operationId: market_parameters_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this market parameter.
        required: true
      tags:
      - market-parameters
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketParameter'
          description: ''
    put:
      operationId: market_parameters_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this market parameter.
        required: true
      tags:
      - market-parameters
