        - `create` / `update` → `SupplierWriteSerializer`
        - `retrieve` → `SupplierDetailSerializer`
        - `destroy`  → soft-delete (`is_active = false`), 409 if SKUs still linked
      parameters:
      - in: query
        name: currency_default
        schema:
          type: string
          enum:
          - EUR
          - RMB
          - USD
        description: |-
          * `EUR` - Euro
          * `USD` - US Dollar
          * `RMB` - Renminbi
      - in: query
        name: has_skus
        schema:
          type: boolean
      - in: query
        name: incoterm_default
        schema:
          type: string
          enum:
          - CFR
          - CIF
          - CIP
          - CPT
          - DAP
          - DDP
          - DPU
          - EXW
          - FAS
          - FCA
          - FOB
        description: |-
          * `EXW` - Ex Works
          * `FCA` - Free Carrier
          * `FAS` - Free Alongside Ship
          * `FOB` - Free On Board
          * `CFR` - Cost and Freight
          * `CIF` - Cost, Insurance and Freight
          * `CPT` - Carriage Paid To
          * `CIP` - Carriage and Insurance Paid To
          * `DAP` - Delivered At Place
          * `DPU` - Delivered at Place Unloaded
          * `DDP` - Delivered Duty Paid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - suppliers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierListList'
          description: ''
