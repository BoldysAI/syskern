components:
  schemas:
    AttributeRegistry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        value_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        label:
          description: 'Multilingual {"fr": "...", "en": "...", "es": "..."}'
        category:
          $ref: '#/components/schemas/AttributeRegistryCategoryEnum'
        data_type:
          $ref: '#/components/schemas/DataTypeEnum'
        options:
          nullable: true
          description: 'For select / multiselect: [{"value": "...", "label": {...}}]'
        unit:
          type: string
          maxLength: 32
        is_required:
          type: boolean
        is_searchable:
          type: boolean
        is_filterable:
          type: boolean
        default_value:
          nullable: true
        display_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - category
      - code
      - created_at
      - data_type
      - id
      - label
      - updated_at
      - value_count
    AttributeRegistryCategoryEnum:
      enum:
      - structural
      - technical
      - marketing
      - commercial
      - logistic
      type: string
      description: |-
        * `structural` - Structural
        * `technical` - Technical
        * `marketing` - Marketing
        * `commercial` - Commercial
        * `logistic` - Logistic
    BaseUnitEnum:
      enum:
      - unit
      - km
      - m
      type: string
      description: |-
        * `unit` - Unit
        * `km` - Kilometre
        * `m` - Metre
    BlankEnum:
      enum:
      - ''
    Category42cEnum:
      enum:
      - maritime
      - road
      - air
      - rail
      type: string
      description: |-
        * `maritime` - Maritime
        * `road` - Road
        * `air` - Air
        * `rail` - Rail
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        odoo_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        is_prospect:
          type: boolean
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 64
        address_street:
          type: string
          maxLength: 255
        address_city:
          type: string
          maxLength: 128
        address_zip:
          type: string
          maxLength: 32
        address_country:
          type: string
          maxLength: 64
        preferred_currency:
          oneOf:
          - $ref: '#/components/schemas/CurrencyDefaultEnum'
          - $ref: '#/components/schemas/BlankEnum'
        preferred_incoterm:
          oneOf:
          - $ref: '#/components/schemas/PreferredIncotermEnum'
          - $ref: '#/components/schemas/BlankEnum'
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
        segment:
          type: string
          maxLength: 64
        notes:
          type: string
        odoo_last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - name
      - odoo_last_sync_at
      - updated_at
    CopperMarketEnum:
      enum:
      - LME
      - SHE
      type: string
      description: |-
        * `LME` - London Metal Exchange
        * `SHE` - Shanghai Futures Exchange
    CurrencyDefaultEnum:
      enum:
      - EUR
      - USD
      - RMB
      type: string
      description: |-
        * `EUR` - Euro
        * `USD` - US Dollar
        * `RMB` - Renminbi
    DataTypeEnum:
      enum:
      - text
      - number
      - boolean
      - date
      - select
      - multiselect
      type: string
      description: |-
        * `text` - Text
        * `number` - Number
        * `boolean` - Boolean
        * `date` - Date
        * `select` - Single choice
        * `multiselect` - Multiple choice
    DocumentLibrary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        product_sku:
          type: string
          readOnly: true
        download_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          description: Multilingual label
        category:
          $ref: '#/components/schemas/DocumentLibraryCategoryEnum'
        file_url:
          type: string
          readOnly: true
        file_name:
          type: string
          readOnly: true
        file_size_bytes:
          type: integer
          readOnly: true
          nullable: true
        mime_type:
          type: string
          readOnly: true
        language:
          oneOf:
          - $ref: '#/components/schemas/LanguageEnum'
          - $ref: '#/components/schemas/BlankEnum'
        description:
          type: string
        version:
          type: integer
          readOnly: true
        uploaded_by:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
        display_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set on soft-delete; purged after 30 days.
        product:
          type: string
          format: uuid
          nullable: true
      required:
      - category
      - created_at
      - deleted_at
      - download_url
      - file_name
      - file_size_bytes
      - file_url
      - id
      - mime_type
      - name
      - product_name
      - product_sku
      - updated_at
      - uploaded_by
      - version
    DocumentLibraryCategoryEnum:
      enum:
      - cgv
      - warranty
      - quality
      - project_reference
      - company
      - other
      type: string
      description: |-
        * `cgv` - CGV — Conditions générales de vente
        * `warranty` - Warranty
        * `quality` - Quality management
        * `project_reference` - Project references
        * `company` - Company presentation
        * `other` - Other
    ExportFormatEnum:
